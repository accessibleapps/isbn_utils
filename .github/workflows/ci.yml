name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.8"
          python-version: "3.12"
          enable-cache: false
      - name: Run tests
        run: uv run --no-project --python 3.12 --with pytest==8.3.5 pytest -q
      - name: Build package
        run: uv build --python 3.12
      - name: Require package artifacts
        run: |
          test -f dist/isbn_utils-0.1.tar.gz
          test -f dist/isbn_utils-0.1-py3-none-any.whl
